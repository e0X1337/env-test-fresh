name: OIDC Claims Test
on: workflow_dispatch
permissions:
  id-token: write
  contents: read
jobs:
  check-claims:
    runs-on: ubuntu-latest
    steps:
      - name: Get and decode OIDC token
        run: |
          OIDC_TOKEN=$(curl -s -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://github.com/e0X1337" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('value','ERROR'))")

          echo "=== OIDC Token Claims ==="
          echo "$OIDC_TOKEN" | cut -d. -f2 | python3 -c "
import json,sys,base64
payload = sys.stdin.read().strip()
payload += '=' * (4 - len(payload) % 4)
decoded = base64.urlsafe_b64decode(payload)
claims = json.loads(decoded)
for k in sorted(claims.keys()):
    if k not in ('iat','exp','nbf','jti','iss','aud'):
        print(f'{k}: {claims[k]}')
"
