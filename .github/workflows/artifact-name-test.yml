name: Artifact Name Test
on: workflow_dispatch
jobs:
  test-names:
    runs-on: ubuntu-latest
    steps:
      - name: Create test files
        run: |
          echo "malicious content" > payload.txt
      
      - name: Upload with path traversal in name
        uses: actions/upload-artifact@v4
        with:
          name: '../../../tmp/evil'
          path: payload.txt
        continue-on-error: true
      
      - name: Upload with dots in name
        uses: actions/upload-artifact@v4
        with:
          name: '..%2F..%2F..%2Ftmp%2Fevil'
          path: payload.txt
        continue-on-error: true
      
      - name: Upload with backslash traversal
        uses: actions/upload-artifact@v4
        with:
          name: '..\..\..\tmp\evil'
          path: payload.txt
        continue-on-error: true
      
      - name: Upload normal artifact for reference
        uses: actions/upload-artifact@v4
        with:
          name: 'normal-artifact'
          path: payload.txt

      - name: List all artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 5
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            | python3 -c "
import json,sys
data = json.load(sys.stdin)
print(f'Total artifacts: {data.get(\"total_count\", 0)}')
for a in data.get('artifacts', []):
    print(f'  Name: {repr(a[\"name\"])} (id={a[\"id\"]})')
"
